<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1060 1020" width="1060" height="1020"><title>Thyristor-switched capacitor + TCR</title><desc>Conceptual SVC shunt circuit. TCR and TSC branches show individual antiparallel SCRs; connections are a single-line/per-phase equivalent, not a simulation.</desc><g id="background" inkscape:groupmode="layer" inkscape:label="Background"><rect x="0" y="0" width="1060" height="1020" rx="0" fill="#F4F7FB" /><rect x="24" y="22" width="1012" height="976" rx="18" fill="#FFFFFF" stroke="#D9E3ED" /></g><g id="titles" inkscape:groupmode="layer" inkscape:label="Titles and legend"><text x="65" y="74" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Thyristor-switched capacitor + TCR</text><text x="65" y="109" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Static VAR compensator  |  functional electrical diagram</text><line x1="65" y1="130" x2="995" y2="130" stroke="#D9E3ED" stroke-width="2" stroke-linecap="round" /><text x="90" y="153" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">PCC / AC GRID</text><text x="90" y="338" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">SVC BUS</text><text x="85" y="858" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Symbolic return (phase-equivalent representation)</text><line x1="66" y1="888" x2="994" y2="888" stroke="#D9E3ED" stroke-width="2" stroke-linecap="round" /><text x="85" y="921" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">TCR: phase-angle control   |   TSC / TSR: switched steps   |   FC: fixed capacitor   |   FILTER: tuned LC branch</text><text x="85" y="949" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Conceptual single-line/per-phase diagram. Actual three-phase delta/wye connections and ratings are not specified.</text><text x="85" y="978" fill="#697B90" font-family="STIX Math, Cambria Math, DejaVu Serif, serif" font-size="15" text-anchor="start" data-math-notation="mixed"><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="roman">TCR firing range: </tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="roman">90</tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="unit">°</tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="roman"> ≤ </tspan><tspan font-style="italic" font-weight="400" font-size="15" data-math-role="variable">α</tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="roman"> ≤ </tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="roman">180</tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="unit">°</tspan><tspan font-style="normal" font-weight="400" font-size="15" data-math-role="roman">   |   Conceptual only, not an EMT simulation.</tspan></text></g><g id="buses" inkscape:groupmode="layer" inkscape:label="Grid, transformer and buses"><line x1="210.0" y1="170" x2="850.0" y2="170" stroke="#24364A" stroke-width="5.0" stroke-linecap="round" /><circle cx="210.0" cy="170" r="6" fill="#24364A" stroke="#24364A" stroke-width="3" /><circle cx="850.0" cy="170" r="6" fill="#24364A" stroke="#24364A" stroke-width="3" /><g id="coupling-transformer" data-device="transformer"><line x1="530.0" y1="170" x2="530.0" y2="207" stroke="#24364A" stroke-width="3.4" stroke-linecap="round" /><circle cx="530.0" cy="235" r="28" fill="none" stroke="#24364A" stroke-width="3" /><circle cx="530.0" cy="282" r="28" fill="none" stroke="#24364